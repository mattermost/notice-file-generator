name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout Code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: "Execute Tests"
        run: make test
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout Code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: "Lint"
        run: make lint
  vulncheck:
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout Code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: "Check for known vulnerabilities"
        run: make vulncheck
